<!DOCTYPE html >
<html lang="zh-CN">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RTSmini · APP 首页</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="skin.css">
<style>
.app-home{
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 16px;gap:12px;
}
.app-home__logo{
  width:72px;height:72px;border-radius:var(--r-card);
  background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:700;margin-bottom:8px;
}
.app-home__title{font-size:20px;font-weight:600;color:var(--text)}
.app-home__desc{font-size:14px;line-height:22px;color:var(--text-2)}
.app-home__btn{margin-top:20px}
</style></head>
<body>
<div class="u-page">
  <div class="app-home">
    <div class="app-home__logo">R</div>
    <div class="app-home__title">APP 首页</div>
    <div class="app-home__desc">这里是整个 APP 的首页入口<br>请从下方进入对应业务频道</div>
    <button class="u-btn u-btn--primary app-home__btn" onclick="go('b001_home.html')">进入获客频道</button>
  </div>
</div>
<script>
function go(url){ location.href = url; }
</script>
</body>
</html>
