<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活动列表</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="skin.css">
<style id="skin">/* 活动列表（C023 · 演示专用） */
.container{padding:calc(var(--nav-h) + env(safe-area-inset-top) + 16px) 16px 24px}

/* ---------- 演示说明 ---------- */
.demo-note{margin-bottom:16px;padding:12px;border-radius:var(--r-input);background:var(--gray-1);font-size:12px;line-height:20px;color:var(--text-2)}

/* ---------- 活动卡片 ---------- */
.act-card{display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:12px;background:var(--card);border-radius:var(--r-card);cursor:pointer}
.act-card:active{background:var(--gray-1)}
.act-thumb{width:56px;height:56px;flex-shrink:0;border-radius:var(--r-input);background:var(--disabled);display:flex;align-items:center;justify-content:center}
.act-thumb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act-info{flex:1;min-width:0}
.act-name{font-size:15px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-shop{margin-top:2px;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}</style>
</head>
<body id="app-body">
<div class="u-page">
  <!-- 顶部导航 -->
  <div class="u-nav">
    <div class="u-nav__back" onclick="go('c022_my_orders.html')" aria-label="返回">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="u-nav__title">活动列表</div>
    <div class="u-nav__action"></div>
  </div>

  <div class="container">
    <div class="demo-note">演示专用：本页集中演示活动在不同状态下的展示形态，点击活动可查看其在活动详情页的实际呈现；非正式功能页面。</div>
    <div id="actList"></div>
  </div>
</div>

<script>/* 演示专用：本页仅用于集中演示活动在不同状态下的展示形态，非正式功能页面。
   活动与《活动详情》页 C 端活动一一对应（id 相同），点击卡片进入对应活动详情页查看实际呈现。 */
var activities = [
  { id: 1, name: '焕活新生，焕出水润透亮肌', shop: '轻奢美肌中心', tag: 'warning', state: '老带新 · 已成团待领取' },
  { id: 2, name: '潮流造型，焕新从头开始', shop: '潮流造型屋', tag: 'gray', state: '未配置老带新玩法' },
  { id: 3, name: '轻奢剪发，剪出自信新形象', shop: '丝语造型工作室', tag: 'success', state: '老带新 · 奖励已发放' },
  { id: 4, name: '深层清洁，唤醒清透肌底', shop: '净颜美学馆', tag: 'brand', state: '老带新 · 参团中（还差 2 笔成团）' },
  /* 已下架：详情页可正常浏览，但不可下单（见《活动详情 PRD》F8 规则 4） */
  { id: 5, name: '焕新美甲，点亮指尖色彩', shop: '指尖美学馆', tag: 'archive', state: '已下架 · 不可下单' }
];

var thumbIcon = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>';

document.getElementById('actList').innerHTML = activities.map(function(a){
  return '<div class="act-card" onclick="go(\'c019_insider_detail.html?id=' + a.id + '\')">' +
    '<div class="act-thumb">' + thumbIcon + '</div>' +
    '<div class="act-info">' +
      '<div class="act-name">' + a.name + '</div>' +
      '<div class="act-shop">' + a.shop + '</div>' +
      '<div class="act-tags"><span class="u-tag u-tag--' + a.tag + '">' + a.state + '</span></div>' +
    '</div>' +
  '</div>';
}).join('');

function go(url){ location.href = url; }</script>
</body>
</html>
